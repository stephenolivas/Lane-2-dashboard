name: Update Lane 2 Dashboard

on:
  workflow_dispatch:
    inputs:
      backfill_month:
        description: 'Optional YYYY-MM to backfill (e.g. 2026-06). Leave blank for normal run.'
        required: false
        default: ''
  # Backup cron in case cron-job.org is down — every 30 min, weekdays only.
  schedule:
    - cron: '*/30 13-23 * * 1-5'  # ~6 AM – 4 PM PT

concurrency:
  group: lane2-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Bumped from 25 → 40 to accommodate backfill runs which pull a full
    # month of closed-won opps + per-lead VQD checks.
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      # Make Python flush stdout/stderr immediately so the workflow log shows
      # progress in real time instead of after the step finishes.
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetcher
        env:
          CLOSE_API_KEY:  ${{ secrets.CLOSE_API_KEY }}
          # Empty on scheduled / cron-job.org runs → normal mode.
          # Set from the "Run workflow" dialog → backfill mode for that month.
          BACKFILL_MONTH: ${{ inputs.backfill_month }}
        # -u forces unbuffered output as a belt-and-suspenders alongside PYTHONUNBUFFERED.
        run: python -u scripts/fetch_data.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json archives/
          if ! git diff --cached --quiet; then
            if [ -n "${{ inputs.backfill_month }}" ]; then
              git commit -m "backfill: ${{ inputs.backfill_month }} — rewrite monthly + weekly archives"
            else
              git commit -m "auto: refresh lane2 data $(date -u +'%Y-%m-%d %H:%M UTC')"
            fi
            git push
          else
            echo "No changes to commit."
          fi
