name: Update Lane 2 Dashboard

on:
  workflow_dispatch:
  # Backup cron in case cron-job.org is down — every 30 min, weekdays only.
  # Remove this if you only want cron-job.org as the trigger.
  schedule:
    - cron: '*/30 13-23 * * 1-5'  # ~6 AM – 4 PM PT

concurrency:
  group: lane2-dashboard
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run fetcher
        env:
          CLOSE_API_KEY: ${{ secrets.CLOSE_API_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json archives/
          if ! git diff --cached --quiet; then
            git commit -m "auto: refresh lane2 data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "No changes to commit."
          fi
