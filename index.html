<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lane 2 Activity Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --text: #18181b;
    --text-muted: #71717a;
    --text-subtle: #a1a1aa;
    --border: #e4e4e7;
    --border-strong: #d4d4d8;
    --accent: #1e40af;
    --accent-soft: #dbeafe;
    --accent-text: #1e3a8a;
    --warn: #b45309;
    --warn-soft: #fef3c7;
    --good: #15803d;
    --good-soft: #dcfce7;
    --bad: #b91c1c;
    --bad-soft: #fee2e2;
    --stripe: #f8f8f7;
    --heat-0: transparent;
    --heat-1: #eff6ff;
    --heat-2: #dbeafe;
    --heat-3: #bfdbfe;
    --heat-4: #93c5fd;
    --heat-5: #60a5fa;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist', system-ui, -apple-system, sans-serif;
    font-size: 14px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: 'ss01', 'cv11';
  }

  .num {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-feature-settings: 'tnum' 1;
  }

  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 32px 28px 64px;
  }

  /* ── Header ─────────────────────────────────────────────────────────── */
  header.dash-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    margin-bottom: 28px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .title-block h1 {
    font-size: 28px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.025em;
  }
  .title-block .subtitle {
    color: var(--text-muted);
    font-size: 14px;
    margin-top: 2px;
  }
  .header-meta {
    display: flex;
    align-items: center;
    gap: 18px;
    font-size: 13px;
    color: var(--text-muted);
  }
  .header-meta a {
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }
  .header-meta a:hover { text-decoration: underline; }
  .live-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--good);
    margin-right: 6px;
    vertical-align: 1px;
    animation: pulse 2.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  /* ── KPI strip ──────────────────────────────────────────────────────── */
  .kpi-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
  }
  .kpi .label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 500;
  }
  .kpi .value {
    font-size: 24px;
    font-weight: 600;
    margin-top: 6px;
    letter-spacing: -0.015em;
  }
  .kpi .value .unit {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    margin-left: 4px;
  }

  /* ── Section ────────────────────────────────────────────────────────── */
  .section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .section-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .section-head h2 {
    font-size: 15px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .section-head .helper {
    font-size: 12px;
    color: var(--text-muted);
  }

  /* ── Calendar ───────────────────────────────────────────────────────── */
  .calendar {
    padding: 16px 20px 20px;
  }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .cal-weekdays div {
    text-align: center;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    padding: 4px 0;
    font-weight: 500;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-cell {
    aspect-ratio: 1.4 / 1;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--surface);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    position: relative;
  }
  .cal-cell.has-count:hover {
    transform: translateY(-1px);
    box-shadow: 0 2px 6px rgba(0,0,0,0.06);
  }
  .cal-cell.empty {
    background: transparent;
    border: 1px solid transparent;
  }
  .cal-cell.weekend {
    background: var(--stripe);
  }
  .cal-cell.future {
    background: var(--stripe);
    opacity: 0.5;
  }
  .cal-cell.today {
    box-shadow: inset 0 0 0 2px var(--accent);
  }
  .cal-day-num {
    font-size: 11px;
    font-weight: 500;
    color: var(--text-muted);
    align-self: flex-start;
  }
  .cal-cell.today .cal-day-num {
    color: var(--accent);
    font-weight: 600;
  }
  .cal-count {
    font-size: 22px;
    font-weight: 600;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.02em;
    align-self: flex-end;
    line-height: 1;
  }
  .cal-cell.zero .cal-count {
    color: var(--text-subtle);
    font-weight: 400;
  }
  .cal-cell.heat-1 { background-color: var(--heat-1); }
  .cal-cell.heat-2 { background-color: var(--heat-2); }
  .cal-cell.heat-3 { background-color: var(--heat-3); }
  .cal-cell.heat-4 { background-color: var(--heat-4); }
  .cal-cell.heat-5 { background-color: var(--heat-5); color: var(--surface); }
  .cal-cell.heat-5 .cal-day-num { color: rgba(255,255,255,0.85); }
  .cal-cell.heat-4 .cal-day-num { color: var(--accent-text); }
  .cal-cell.heat-5 .cal-count { color: var(--surface); }

  /* Hover popover showing per-day handraiser breakdown */
  .cal-breakdown {
    display: none;
    position: absolute;
    bottom: calc(100% + 6px);
    left: 50%;
    transform: translateX(-50%);
    z-index: 30;
    background: var(--text);
    color: var(--surface);
    border-radius: 6px;
    padding: 10px 12px;
    min-width: 220px;
    max-width: 320px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
    font-size: 12px;
    line-height: 1.4;
    pointer-events: none;
  }
  .cal-breakdown::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: var(--text);
  }
  .cal-breakdown .cal-bd-head {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: rgba(255,255,255,0.55);
    margin-bottom: 6px;
    font-weight: 500;
  }
  .cal-breakdown .cal-bd-row {
    display: flex;
    gap: 8px;
    align-items: baseline;
  }
  .cal-breakdown .cal-bd-count {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    font-weight: 500;
    min-width: 26px;
    text-align: right;
    color: var(--surface);
  }
  .cal-breakdown .cal-bd-label {
    color: rgba(255,255,255,0.85);
  }
  .cal-breakdown .cal-bd-label.unset {
    font-style: italic;
    color: rgba(255,255,255,0.55);
  }
  .cal-cell.has-count:hover .cal-breakdown {
    display: block;
  }
  /* Edge cells: shift the popover so it doesn't fall off the left/right */
  .cal-grid > .cal-cell:nth-child(7n+1) .cal-breakdown { left: 0; transform: none; }
  .cal-grid > .cal-cell:nth-child(7n+1) .cal-breakdown::after { left: 20px; transform: none; }
  .cal-grid > .cal-cell:nth-child(7n) .cal-breakdown { left: auto; right: 0; transform: none; }
  .cal-grid > .cal-cell:nth-child(7n) .cal-breakdown::after { left: auto; right: 20px; transform: none; }

  /* ── Side panel (day drill-down) ────────────────────────────────────── */
  .side-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.25);
    opacity: 0; pointer-events: none;
    transition: opacity 0.2s ease;
    z-index: 90;
  }
  .side-overlay.open { opacity: 1; pointer-events: auto; }
  .side-panel {
    position: fixed;
    top: 0; right: 0;
    width: min(560px, 92vw);
    height: 100vh;
    background: var(--surface);
    box-shadow: -8px 0 24px rgba(0,0,0,0.12);
    transform: translateX(100%);
    transition: transform 0.22s ease;
    z-index: 100;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .side-panel.open { transform: translateX(0); }
  .side-panel-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    position: sticky;
    top: 0;
    background: var(--surface);
    z-index: 1;
  }
  .side-panel-head h2 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 2px 0;
    letter-spacing: -0.015em;
  }
  .side-panel-head .panel-sub {
    font-size: 12.5px;
    color: var(--text-muted);
  }
  .side-panel-close {
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1;
    width: 28px; height: 28px;
    border-radius: 6px;
    cursor: pointer;
    padding: 0;
    flex-shrink: 0;
  }
  .side-panel-close:hover {
    color: var(--text);
    border-color: var(--text-muted);
  }
  .side-panel-body {
    padding: 16px 20px 24px;
    flex: 1;
  }
  .side-panel-empty {
    color: var(--text-muted);
    text-align: center;
    padding: 40px 20px;
  }
  .panel-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
  }
  .panel-table th, .panel-table td {
    padding: 8px 8px;
    border-bottom: 1px solid var(--border);
    text-align: left;
    vertical-align: middle;
  }
  .panel-table th {
    background: var(--stripe);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .panel-table td.num, .panel-table th.num {
    text-align: right;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  .panel-table .rep-cell {
    font-weight: 500;
    white-space: nowrap;
  }
  .panel-table .zero-cell { color: var(--text-subtle); font-weight: 400; }
  .panel-table tr.panel-totals td {
    background: var(--stripe);
    font-weight: 600;
    border-top: 2px solid var(--border-strong);
  }
  /* Hint on hover for clickable calendar days */
  .cal-cell.has-count { cursor: pointer; }

  /* ── Rep table ──────────────────────────────────────────────────────── */
  .reps-table-wrap { overflow-x: auto; }
  table.reps {
    width: 100%;
    border-collapse: collapse;
    font-size: 13.5px;
  }
  .reps th, .reps td {
    padding: 12px 14px;
    text-align: left;
    border-bottom: 1px solid var(--border);
    vertical-align: top;
  }
  .reps th {
    background: var(--stripe);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    font-weight: 500;
    white-space: nowrap;
  }
  .reps td.num { text-align: right; }
  .reps th.num { text-align: right; }
  .reps tbody tr:hover { background: var(--stripe); }

  .rep-name {
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .lead-badge {
    font-size: 9.5px;
    font-weight: 600;
    background: var(--accent-soft);
    color: var(--accent-text);
    padding: 1px 6px;
    border-radius: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .owned-cell { min-width: 240px; }
  .owned-total {
    font-weight: 600;
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    margin-bottom: 4px;
  }
  .breakdown-list {
    display: flex;
    flex-direction: column;
    gap: 1px;
    color: var(--text-muted);
    font-size: 12.5px;
  }
  .breakdown-list .bd-row {
    display: flex;
    gap: 8px;
  }
  .breakdown-list .bd-count {
    font-family: 'Geist Mono', ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
    min-width: 26px;
    text-align: right;
    color: var(--text);
    font-weight: 500;
  }
  .breakdown-list .bd-label.unset {
    font-style: italic;
    color: var(--text-subtle);
  }
  .zero-cell.attention {
    color: var(--warn);
    font-weight: 600;
  }
  .zero-cell.attention::before {
    content: '⚠ ';
    font-size: 11px;
  }

  tr.totals-row td {
    background: var(--stripe);
    font-weight: 600;
    border-top: 2px solid var(--border-strong);
    border-bottom: none;
  }
  tr.totals-row .owned-total {
    font-size: 14.5px;
  }

  /* ── Footer ─────────────────────────────────────────────────────────── */
  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--text-subtle);
    text-align: center;
  }

  /* ── States ─────────────────────────────────────────────────────────── */
  .loading, .error {
    padding: 80px 20px;
    text-align: center;
    color: var(--text-muted);
  }
  .error { color: var(--bad); }

  @media (max-width: 760px) {
    .container { padding: 16px; }
    .kpi-strip { grid-template-columns: repeat(2, 1fr); }
    .cal-count { font-size: 16px; }
    .reps th, .reps td { padding: 10px 8px; font-size: 12.5px; }
  }
</style>
</head>
<body>
<div class="container" id="root">
  <div class="loading">Loading dashboard…</div>
</div>

<div class="side-overlay" id="side-overlay" onclick="closeSidePanel()"></div>
<aside class="side-panel" id="side-panel" role="dialog" aria-modal="true" aria-labelledby="side-panel-title">
  <div class="side-panel-head">
    <div>
      <h2 id="side-panel-title">Day breakdown</h2>
      <div class="panel-sub" id="side-panel-sub"></div>
    </div>
    <button class="side-panel-close" onclick="closeSidePanel()" aria-label="Close">✕</button>
  </div>
  <div class="side-panel-body" id="side-panel-body"></div>
</aside>

<script>
const WEEKDAY_LABELS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];

// Cached so the side-panel click handler can access without re-fetching
let DATA = null;

function fmtInt(n) {
  if (n == null) return '—';
  return Number(n).toLocaleString();
}

function fmtUpdated(iso) {
  try {
    const d = new Date(iso);
    return d.toLocaleString('en-US', {
      month: 'short', day: 'numeric',
      hour: 'numeric', minute: '2-digit',
      timeZone: 'America/Los_Angeles'
    }) + ' PT';
  } catch (e) { return iso; }
}

function heatClass(count, maxCount) {
  if (!count) return 'zero';
  if (maxCount <= 0) return '';
  const pct = count / maxCount;
  if (pct >= 0.85) return 'heat-5';
  if (pct >= 0.65) return 'heat-4';
  if (pct >= 0.45) return 'heat-3';
  if (pct >= 0.25) return 'heat-2';
  return 'heat-1';
}

function dateFromKey(key) {
  // key is "YYYY-MM-DD"; build a Date that's stable in any TZ (use noon UTC)
  const [y, m, d] = key.split('-').map(Number);
  return new Date(Date.UTC(y, m - 1, d, 12, 0, 0));
}

function renderCalBreakdown(dayKey, count, breakdown) {
  // breakdown is { handraiser_label: count }
  const entries = Object.entries(breakdown || {});
  if (!entries.length) return '';
  const rows = entries.map(([label, cnt]) => `
    <div class="cal-bd-row">
      <span class="cal-bd-count">${cnt}</span>
      <span class="cal-bd-label ${label === '(unset)' ? 'unset' : ''}">${label}</span>
    </div>
  `).join('');
  return `<div class="cal-breakdown">
    <div class="cal-bd-head">${dayKey} · ${count} lead${count === 1 ? '' : 's'} assigned</div>
    ${rows}
  </div>`;
}

function renderCalendar(data) {
  const cal = data.calendar || {};
  const breakdowns = data.calendar_breakdowns || {};
  const days = Object.keys(cal).sort();
  if (!days.length) return '<div class="calendar"><em>No days.</em></div>';

  const first = dateFromKey(days[0]);
  // Day-of-week of the 1st (Sun=0)
  const leadingBlanks = first.getUTCDay();

  // Heat scale based on max count (ignore zero-bg)
  const counts = days.map(k => cal[k] || 0);
  const maxCount = Math.max(0, ...counts);

  const today = data.today;

  const cells = [];
  for (let i = 0; i < leadingBlanks; i++) {
    cells.push('<div class="cal-cell empty"></div>');
  }
  for (const k of days) {
    const c = cal[k] || 0;
    const d = dateFromKey(k);
    const dow = d.getUTCDay();
    const dayNum = d.getUTCDate();
    const isToday = (k === today);
    const isFuture = (k > today);
    const klass = [
      'cal-cell',
      isToday ? 'today' : '',
      isFuture ? 'future' : '',
      (dow === 0 || dow === 6) ? 'weekend' : '',
      !isFuture ? heatClass(c, maxCount) : '',
      c > 0 ? 'has-count' : ''
    ].filter(Boolean).join(' ');
    const popover = (c > 0 && !isFuture) ? renderCalBreakdown(k, c, breakdowns[k]) : '';
    const clickAttr = (c > 0 && !isFuture) ? `onclick="openSidePanel('${k}')"` : '';
    cells.push(`
      <div class="${klass}" ${clickAttr}>
        <span class="cal-day-num">${dayNum}</span>
        <span class="cal-count">${isFuture ? '' : c}</span>
        ${popover}
      </div>
    `);
  }

  const weekdayHeaders = WEEKDAY_LABELS.map(w => `<div>${w}</div>`).join('');

  return `
    <div class="calendar">
      <div class="cal-weekdays">${weekdayHeaders}</div>
      <div class="cal-grid">${cells.join('')}</div>
    </div>
  `;
}

function renderBreakdown(breakdown) {
  const entries = Object.entries(breakdown || {});
  if (!entries.length) return '<div class="breakdown-list"><div class="bd-row"><span class="bd-label">—</span></div></div>';

  // Sort: (unset) last, others by count desc
  entries.sort((a, b) => {
    if (a[0] === '(unset)') return 1;
    if (b[0] === '(unset)') return -1;
    return b[1] - a[1];
  });

  return `<div class="breakdown-list">
    ${entries.map(([label, count]) => `
      <div class="bd-row">
        <span class="bd-count">${count}</span>
        <span class="bd-label ${label === '(unset)' ? 'unset' : ''}">${label}</span>
      </div>
    `).join('')}
  </div>`;
}

function renderReps(data) {
  const reps = data.reps || [];
  if (!reps.length) return '<p style="padding:20px;color:var(--text-muted)">No reps configured.</p>';

  const bizDays = Math.max(data.business_days_elapsed || 1, 1);

  // Aggregate handraiser breakdown for the totals row
  const aggBreak = {};
  let aggOwned = 0, aggActs = 0, aggZero = 0, aggCallsMtd = 0, aggEmailsMtd = 0,
      aggBooked = 0, aggWon = 0, aggLost = 0;

  for (const r of reps) {
    aggOwned += r.owned_leads || 0;
    aggActs += r.activities_mtd || 0;
    aggZero += r.leads_zero_comms || 0;
    aggCallsMtd += r.outbound_calls_mtd || 0;
    aggEmailsMtd += r.outbound_emails_mtd || 0;
    aggBooked += r.calls_booked_mtd || 0;
    aggWon += r.deals_closed_mtd || 0;
    aggLost += r.deals_lost_mtd || 0;
    for (const [k, v] of Object.entries(r.handraiser_breakdown || {})) {
      aggBreak[k] = (aggBreak[k] || 0) + v;
    }
  }
  const aggCallsAvg  = (aggCallsMtd  / bizDays).toFixed(1);
  const aggEmailsAvg = (aggEmailsMtd / bizDays).toFixed(1);

  const fmtAvg = (n) => (n == null ? '—' : Number(n).toFixed(1));

  const rows = reps.map(r => {
    const zeroAttn = (r.leads_zero_comms || 0) > 0;
    return `
      <tr>
        <td>
          <div class="rep-name">
            ${r.name}
            ${r.is_lead ? '<span class="lead-badge">Lead</span>' : ''}
          </div>
        </td>
        <td class="owned-cell">
          <div class="owned-total">Total = ${fmtInt(r.owned_leads)}</div>
          ${renderBreakdown(r.handraiser_breakdown)}
        </td>
        <td class="num">${fmtInt(r.activities_mtd)}</td>
        <td class="num zero-cell ${zeroAttn ? 'attention' : ''}">${fmtInt(r.leads_zero_comms)}</td>
        <td class="num" title="${r.outbound_calls_mtd || 0} total / ${bizDays} business days">${fmtAvg(r.outbound_calls_per_day_avg)}</td>
        <td class="num" title="${r.outbound_emails_mtd || 0} total / ${bizDays} business days">${fmtAvg(r.outbound_emails_per_day_avg)}</td>
        <td class="num">${fmtInt(r.calls_booked_mtd)}</td>
        <td class="num">${fmtInt(r.deals_closed_mtd)}</td>
        <td class="num">${fmtInt(r.deals_lost_mtd)}</td>
      </tr>
    `;
  }).join('');

  return `
    <div class="reps-table-wrap">
      <table class="reps">
        <thead>
          <tr>
            <th>Rep</th>
            <th># Owned Leads</th>
            <th class="num"># Activities</th>
            <th class="num">Leads w/ 0 Comms</th>
            <th class="num">Outbound Calls /day</th>
            <th class="num">Outbound Emails /day</th>
            <th class="num">Calls Booked</th>
            <th class="num">Deals Closed</th>
            <th class="num">Deals Lost</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr class="totals-row">
            <td>Team Total</td>
            <td class="owned-cell">
              <div class="owned-total">Total = ${fmtInt(aggOwned)}</div>
              ${renderBreakdown(aggBreak)}
            </td>
            <td class="num">${fmtInt(aggActs)}</td>
            <td class="num">${fmtInt(aggZero)}</td>
            <td class="num" title="${aggCallsMtd} total / ${bizDays} business days">${aggCallsAvg}</td>
            <td class="num" title="${aggEmailsMtd} total / ${bizDays} business days">${aggEmailsAvg}</td>
            <td class="num">${fmtInt(aggBooked)}</td>
            <td class="num">${fmtInt(aggWon)}</td>
            <td class="num">${fmtInt(aggLost)}</td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

function render(data) {
  const totalCalendar = Object.values(data.calendar || {}).reduce((s, n) => s + (n || 0), 0);
  const totalOwned = (data.reps || []).reduce((s, r) => s + (r.owned_leads || 0), 0);
  const totalZero = (data.reps || []).reduce((s, r) => s + (r.leads_zero_comms || 0), 0);
  const totalBooked = (data.reps || []).reduce((s, r) => s + (r.calls_booked_mtd || 0), 0);
  const monthLabel = data.month || data.month_label || '';

  document.getElementById('root').innerHTML = `
    <header class="dash-header">
      <div class="title-block">
        <h1>Lane 2 Activity</h1>
        <div class="subtitle">${monthLabel} · Lane 2 lead assignments &amp; rep activity</div>
      </div>
      <div class="header-meta">
        <span><span class="live-dot"></span>Updated ${fmtUpdated(data.generated_at)}</span>
        <a href="archive.html">View archive →</a>
      </div>
    </header>

    <div class="kpi-strip">
      <div class="kpi">
        <div class="label">Assignments MTD</div>
        <div class="value num">${fmtInt(totalCalendar)}</div>
      </div>
      <div class="kpi">
        <div class="label">Owned Leads (Now)</div>
        <div class="value num">${fmtInt(totalOwned)}</div>
      </div>
      <div class="kpi">
        <div class="label">Leads w/ 0 Comms</div>
        <div class="value num">${fmtInt(totalZero)}</div>
      </div>
      <div class="kpi">
        <div class="label">Calls Booked MTD</div>
        <div class="value num">${fmtInt(totalBooked)}</div>
      </div>
    </div>

    <section class="section">
      <div class="section-head">
        <h2>Lead assignments — ${monthLabel}</h2>
        <span class="helper">Click any day for a per-rep breakdown. Hover for handraiser mix.</span>
      </div>
      ${renderCalendar(data)}
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Rep details</h2>
        <span class="helper">Owned leads = snapshot now · Activity/deal metrics = MTD · 0-comms = ever</span>
      </div>
      ${renderReps(data)}
    </section>

    <footer>
      Lane 2 Activity · auto-refresh every 15 min (Mon–Fri) · data source: Close CRM
    </footer>
  `;
}

async function main() {
  try {
    const resp = await fetch('data.json', { cache: 'no-store' });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const data = await resp.json();
    DATA = data;
    render(data);
  } catch (e) {
    document.getElementById('root').innerHTML =
      `<div class="error">Failed to load data.json — ${e.message}</div>`;
  }
}

// ── Side panel: day drill-down ──────────────────────────────────────────

function fmtDayHeading(dayKey) {
  const [y, m, d] = dayKey.split('-').map(Number);
  const dt = new Date(Date.UTC(y, m - 1, d, 12));
  return dt.toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric',
    timeZone: 'UTC'
  });
}

function openSidePanel(dayKey) {
  if (!DATA) return;
  const totalLeads = (DATA.calendar || {})[dayKey] || 0;
  const breakdownByRep = (DATA.daily_breakdowns || {})[dayKey] || {};
  const handraisers = (DATA.calendar_breakdowns || {})[dayKey] || {};

  // Title + sub
  document.getElementById('side-panel-title').textContent = fmtDayHeading(dayKey);
  const handraisersText = Object.entries(handraisers)
    .map(([label, n]) => `${n} ${label}`)
    .join(' · ');
  document.getElementById('side-panel-sub').innerHTML =
    `<strong class="num">${totalLeads}</strong> lead${totalLeads === 1 ? '' : 's'} assigned`
    + (handraisersText ? `<br><span style="color:var(--text-subtle)">${handraisersText}</span>` : '');

  // Body: per-rep table
  const reps = Object.values(breakdownByRep).filter(r =>
    (r.new_leads || 0) + (r.outbound_calls || 0) + (r.outbound_emails || 0)
    + (r.calls_booked || 0) + (r.deals_closed || 0) > 0
  );
  reps.sort((a, b) => (b.new_leads || 0) - (a.new_leads || 0)
                       || (b.outbound_calls || 0) - (a.outbound_calls || 0));

  const body = document.getElementById('side-panel-body');
  if (!reps.length) {
    body.innerHTML = '<div class="side-panel-empty">No rep activity recorded for this day.</div>';
  } else {
    let totalNew = 0, totalCalls = 0, totalEmails = 0, totalBooked = 0, totalWon = 0;
    const rows = reps.map(r => {
      totalNew    += r.new_leads || 0;
      totalCalls  += r.outbound_calls || 0;
      totalEmails += r.outbound_emails || 0;
      totalBooked += r.calls_booked || 0;
      totalWon    += r.deals_closed || 0;
      const dim = (n) => (n ? '' : 'zero-cell');
      return `<tr>
        <td class="rep-cell">${r.name}</td>
        <td class="num ${dim(r.new_leads)}">${fmtInt(r.new_leads)}</td>
        <td class="num ${dim(r.outbound_calls)}">${fmtInt(r.outbound_calls)}</td>
        <td class="num ${dim(r.outbound_emails)}">${fmtInt(r.outbound_emails)}</td>
        <td class="num ${dim(r.calls_booked)}">${fmtInt(r.calls_booked)}</td>
        <td class="num ${dim(r.deals_closed)}">${fmtInt(r.deals_closed)}</td>
      </tr>`;
    }).join('');

    body.innerHTML = `
      <table class="panel-table">
        <thead>
          <tr>
            <th>Rep</th>
            <th class="num">New Leads</th>
            <th class="num">Outbound Calls</th>
            <th class="num">Outbound Emails</th>
            <th class="num">Calls Booked</th>
            <th class="num">Deals Closed</th>
          </tr>
        </thead>
        <tbody>
          ${rows}
          <tr class="panel-totals">
            <td>Total</td>
            <td class="num">${fmtInt(totalNew)}</td>
            <td class="num">${fmtInt(totalCalls)}</td>
            <td class="num">${fmtInt(totalEmails)}</td>
            <td class="num">${fmtInt(totalBooked)}</td>
            <td class="num">${fmtInt(totalWon)}</td>
          </tr>
        </tbody>
      </table>
    `;
  }

  document.getElementById('side-panel').classList.add('open');
  document.getElementById('side-overlay').classList.add('open');
}

function closeSidePanel() {
  document.getElementById('side-panel').classList.remove('open');
  document.getElementById('side-overlay').classList.remove('open');
}

// Allow ESC to close the panel
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSidePanel();
});

// Expose to inline onclick handlers in the calendar HTML
window.openSidePanel = openSidePanel;
window.closeSidePanel = closeSidePanel;

main();
</script>
</body>
</html>
